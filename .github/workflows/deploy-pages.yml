name: Deploy SPA to GitHub Pages

# Publishes the spa/ folder to GitHub Pages on every push to main, and
# after the daily-refresh workflow updates spa/data.json.

on:
  push:
    branches: [main]
    paths:
      - 'spa/**'
      - 'data/data.json'      # daily-refresh commits this → triggers a redeploy
      - 'docs/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

# Note: we deliberately do NOT use a workflow_run trigger on the daily refresh.
# The daily-refresh job commits spa/data.json + data/data.json, and that push
# triggers this workflow via the paths filter above — so deploys happen exactly
# once per data change, with no double-fire. If the refresh makes no change it
# commits nothing, so no needless deploy.

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Two jobs, as in GitHub's starter workflow: deploy-pages run in the same job
# right after the upload sometimes finds no "github-pages" artifact
# (actions/deploy-pages#451; this repository on 23 and 27 November 2026).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Build site bundle
        run: |
          mkdir -p _site
          cp -r spa/* _site/
          cp -r docs _site/docs
          # Ensure data is fresh in the deployed bundle
          cp data/data.json _site/data.json
          # Disable Jekyll processing
          touch _site/.nojekyll

      - name: Cache-bust static assets (per-file content hash)
        # GitHub Pages serves everything with Cache-Control: max-age=600 and offers no way to set
        # per-file headers, so a returning visitor can be served a stale code/CSS file from cache
        # for up to 10 minutes (a plain refresh won't help — only a hard refresh would). To remove
        # that entirely, append a CONTENT HASH to each code/CSS reference in index.html. The hash
        # changes only when that file's bytes change, so:
        #   • a changed file gets a new URL → the browser is forced to fetch it fresh (no hard
        #     refresh ever needed), and
        #   • an unchanged file keeps its URL → it stays cached (no needless re-download).
        # data.json and the markdown are already fetched with cache:'no-store', so they're exempt.
        # The source index.html keeps clean, query-free references — this rewrite is build-only.
        run: |
          cd _site
          for f in styles.css metrics-doc.js md.js app.js; do
            [ -f "$f" ] || { echo "::error::missing asset $f"; exit 1; }
            h=$(md5sum "$f" | cut -c1-10)
            esc=$(printf '%s' "$f" | sed 's/\./\\./g')
            sed -i -E "s#(href|src)=\"${esc}\"#\1=\"${f}?v=${h}\"#g" index.html
          done
          echo "Hashed asset references:"
          grep -oE "(styles\.css|metrics-doc\.js|md\.js|app\.js)\?v=[0-9a-f]+" index.html

      - name: Inject analytics script
        if: vars.TIDESIGHT_URL != '' && vars.TIDESIGHT_SITE_ID != ''
        env:
          ANALYTICS_URL: ${{ vars.TIDESIGHT_URL }}
          ANALYTICS_SITE: ${{ vars.TIDESIGHT_SITE_ID }}
          ANALYTICS_ROOT: _site
        run: |
          python3 - <<'PY'
          # Tags every HTML page published from ANALYTICS_ROOT. A page without </head>
          # fails the deploy instead of going out untracked; a small redirect page is
          # left alone (the page it leads to is counted).
          import os, pathlib, re, sys
          url, site = os.environ["ANALYTICS_URL"], os.environ["ANALYTICS_SITE"]
          root = pathlib.Path(os.environ["ANALYTICS_ROOT"])
          tag = f'  <script async src="{url}" data-site="{site}"></script>\n'
          redirect = re.compile(r"""http-equiv=["']?refresh|location\.replace\(""", re.I)
          tagged, redirects, missing = [], [], []
          for p in sorted(root.rglob("*.html")):
              rel = p.relative_to(root)
              if any(part.startswith(".") or part == "node_modules" for part in rel.parts):
                  continue
              html = p.read_text(encoding="utf-8")
              if url in html:
                  tagged.append(rel.as_posix())
                  continue
              if redirect.search(html) and len(html) < 4000:
                  redirects.append(rel.as_posix())
                  continue
              head = re.search(r"</head\s*>", html, re.I)
              if not head:
                  missing.append(rel.as_posix())
                  continue
              p.write_text(html[:head.start()] + tag + html[head.start():], encoding="utf-8")
              tagged.append(rel.as_posix())
          print("Tagged:", *tagged, sep="\n  ")
          if redirects:
              print("Redirect pages, not tagged:", *redirects, sep="\n  ")
          if missing:
              print("::error::No </head> to tag in: " + ", ".join(missing))
              sys.exit(1)
          if not tagged:
              print("::error::No page was tagged under " + str(root))
              sys.exit(1)
          PY

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
